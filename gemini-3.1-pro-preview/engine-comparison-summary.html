<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Comparison Summary</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --accent-color: #38bdf8;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --surface-color: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --primary-color: #3b82f6;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        .dashboard {
            display: grid;
            gap: 2rem;
            grid-template-columns: 1fr;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .badge {
            background-color: var(--primary-color);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        th.num, td.num {
            text-align: right;
        }

        tbody tr:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            tbody tr:hover {
                background-color: rgba(255, 255, 255, 0.02);
            }
        }

        .engine-name {
            font-weight: 500;
            white-space: nowrap;
        }

        .ratio-bar-container {
            width: 100px;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.5rem;
        }

        .ratio-bar {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 3px;
        }

        .ratio-bar.baseline {
            background-color: var(--success-color);
        }
        
        .ratio-bar.slow {
            background-color: var(--warning-color);
        }

        .ratio-bar.very-slow {
            background-color: var(--danger-color);
        }

        .time-val {
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .best-value {
            color: var(--success-color);
            font-weight: 600;
        }

        .null-value {
            color: var(--text-muted);
            font-style: italic;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: -1px;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>

        function formatNumber(num) {
            if (num === null || num === undefined) return '<span class="null-value">N/A</span>';
            return new Intl.NumberFormat('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            }).format(num);
        }

        function getRatioBarClass(ratio) {
            if (ratio <= 1.05) return 'baseline';
            if (ratio <= 2.0) return '';
            if (ratio <= 5.0) return 'slow';
            return 'very-slow';
        }

        function renderTable(benchmark, sf) {
            const items = data.totals[benchmark].filter(item => item.sf === sf);
            
            // Sort by time ascending
            items.sort((a, b) => {
                if (a.time === null) return 1;
                if (b.time === null) return -1;
                return a.time - b.time;
            });

            if (items.length === 0) {
                return '<p style="padding: 1rem; color: var(--text-muted);">No data available for this scale factor.</p>';
            }

            const bestTime = items[0].time;

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Engine</th>
                            <th class="num">Time (s)</th>
                            <th class="num">Ratio</th>
                            <th class="num">Diff (s)</th>
                            <th class="num">Queries</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            items.forEach(item => {
                const isBest = item.time === bestTime;
                const timeClass = isBest ? 'best-value' : '';
                
                // Calculate bar width (max 100%, log scale for very large ratios)
                let barWidth = 0;
                if (item.ratio) {
                    barWidth = Math.min(100, (item.ratio / 5) * 100);
                    if (item.ratio > 5) {
                        barWidth = 80 + Math.min(20, Math.log10(item.ratio) * 10);
                    }
                }

                html += `
                    <tr>
                        <td class="engine-name">${item.engine}</td>
                        <td class="num time-val ${timeClass}">${formatNumber(item.time)}</td>
                        <td class="num time-val">
                            ${formatNumber(item.ratio)}x
                            <div class="ratio-bar-container">
                                <div class="ratio-bar ${getRatioBarClass(item.ratio)}" style="width: ${barWidth}%"></div>
                            </div>
                        </td>
                        <td class="num time-val">${item.diff > 0 ? '+' : ''}${formatNumber(item.diff)}</td>
                        <td class="num">${item.n}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        function switchTab(benchmark, sf) {
            // Update tabs
            const tabs = document.querySelectorAll(`#${benchmark}-tabs .tab`);
            tabs.forEach(tab => {
                if (tab.textContent.toLowerCase().includes(sf === 'all' ? 'all' : `sf ${sf}`)) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Update content
            const contentDiv = document.getElementById(`${benchmark}-content`);
            contentDiv.innerHTML = renderTable(benchmark === 'tpcds' ? 'TPC-DS' : 'TPC-H', sf);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('tpcds', 'all');
            switchTab('tpch', 'all');
        });
